<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carnet de Fonte</title>
    <meta name="description" content="Carnet de musculation : séances, charges, progression et coach." />
    <meta name="theme-color" content="#15191B" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- iPhone : appli plein écran depuis l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fonte" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { height: 100%; background: #E8ECEA; }
      @media (prefers-color-scheme: dark) { html, body { background: #101315; } }
      body { overflow: hidden; margin: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea { font-size: 16px; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <noscript>Active JavaScript pour utiliser Carnet de Fonte.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
