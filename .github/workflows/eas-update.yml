name: Mise à jour à distance (EAS Update)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le token Expo
        id: token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN absent : mise à jour ignorée (voir README)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.skip != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: steps.token.outputs.skip != 'true'
      - run: npx tsc --noEmit
        if: steps.token.outputs.skip != 'true'
      - run: eas update --channel production --message "${{ github.event.head_commit.message || 'Mise à jour manuelle' }}" --non-interactive
        if: steps.token.outputs.skip != 'true'
