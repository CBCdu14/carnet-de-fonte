<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carnet de Fonte</title>
    <meta name="description" content="Carnet de musculation : séances, charges, progression et coach." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- iPhone : appli plein écran depuis l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fonte" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { height: var(--app-h, 100%); background: #F2F2F7; }
      @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
      body { overflow: hidden; margin: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
      #root { display: flex; height: 100%; }
      input, textarea { font-size: 16px; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <noscript>Active JavaScript pour utiliser Carnet de Fonte.</noscript>
    <div id="root"></div>
    <script>
      /* iPhone, appli ouverte depuis l'écran d'accueil : iOS annonce une hauteur de page amputée de la
         barre d'état (bande vide en bas). On cale la hauteur sur la taille réelle de l'écran. */
      (function () {
        var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
        if (!standalone) return;
        function fit() {
          var portrait = window.innerHeight >= window.innerWidth;
          var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          var h = Math.max(window.innerHeight, full);
          document.documentElement.style.setProperty('--app-h', h + 'px');
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
